schema: spec-driven
context: |
  项目：思玥 Siyue，个人与家庭成长；中文沟通，规格保留 OpenSpec 英文结构标题。
  先读 AGENTS.md 和 openspec/README.md。维护者当前明确要求、PROJECT_CHARTER.md、
  docs/decisions.md 的约束优先；本配置不能批准产品方向或外部操作。
  pnpm workspace；移动 React Native + Expo（iOS 优先、Android），桌面 Electron + React。
  domain/contracts 保持平台中立，AI 与 UI 共用业务命令；正式写入需有效审批与事务回执。
  黑白灰明暗主题，设计遵循 DESIGN.md；密钥不得进入规格、日志或测试样例。
  PRODUCT.md 管范围，docs/decisions.md 管决策，openspec/specs 管已验收的现行行为；
  changes 管拟议变化，backlog 管排期，docs/evidence 管真实证据。不要重复维护同一事实。
  当前历史功能未全部迁入 specs；缺规格不代表缺功能。只在涉及该功能时按代码与证据补基线。
rules:
  proposal:
    - 保留 Why / What Changes / Capabilities / Impact；中文填写具体问题、范围与非目标。
    - 关联 SY 工作包和相关决策；无适用工作包时说明原因，不虚构 ID 或已批准排期。
    - 增加 Authorization 小节，记录维护者授权来源、日期、已确认范围与待决项；不得自行填写批准。
    - 区分新功能与现有行为变更；不要把推测、草稿或本地测试写成已交付。
  specs:
    - 保留 Requirement / Scenario 标题，规范句含 SHALL 或 MUST；场景使用 WHEN / THEN，可加 GIVEN。
    - 写用户可观察行为和验收结果，覆盖适用的失败、取消、离线、恢复与权限边界；不适用须解释。
    - 修改现有 Requirement 时在 MODIFIED 中保留完整需求和场景；删除写明原因与迁移安排。
    - 涉及 AI 外发、数据保存或删除必须明确目的、范围、用户控制和失败语义。
  design:
    - 指明受影响模块、跨端差异、替代方案与关键取舍；简单方案简写，不创造无用抽象。
    - 涉及数据或协议时说明 schemaVersion、兼容范围、迁移、回滚与原数据保护。
    - 记录待确认问题；没有重大取舍时明确说明，不为格式虚构决策。
  tasks:
    - 使用带编号的 Markdown 复选框；按依赖拆成可验证的小步，并关联具体 Requirement / Scenario。
    - 包含针对性测试、必要原型或原生验收、代码审查、证据更新与规格同步任务。
    - 只有取得对应证据才勾选；未运行和阻塞保留未完成；归档操作本身不要列为前置待办。
