<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思玥 · 统一产品原型</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
/* Sage tokens mirrored from apps/mobile/src/ui/theme.ts; errorSurface / warn / warnSurface / apple are proposed additions */
.t-light{--focus:#E7EDE5;--focusPressed:#DDE6D9;--onFocus:#25352B;--focusMuted:#506254;--background:#F7F8F2;--surface:#FFFEFA;--ink:#25352B;--muted:#5D695F;--accent:#476B53;--accentPressed:#395A44;--onAccent:#FFFFFF;--subtle:#EDF0E8;--border:#D4DCD0;--controlBorder:#7A8C7C;--error:#A33E32;--errorSurface:#F7E9E5;--warnSurface:#F4EEDC;--warn:#7A5B12;--apple:#000;--onApple:#fff;--scrim:rgba(24,32,26,.34)}
.t-dark{--focus:#28372D;--focusPressed:#334738;--onFocus:#F0F3E9;--focusMuted:#BCCBBB;--background:#151C17;--surface:#202A23;--ink:#F0F3E9;--muted:#B3C0B2;--accent:#B7CDB8;--accentPressed:#A3BDA6;--onAccent:#203326;--subtle:#2D3930;--border:#435346;--controlBorder:#839887;--error:#F1A99D;--errorSurface:#3A2724;--warnSurface:#38321F;--warn:#E8CF8E;--apple:#fff;--onApple:#000;--scrim:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:#E9EBE4;color:#25352B;-webkit-font-smoothing:antialiased}
body.page-dark{background:#0E1310;color:#E6EBE1}
.stage{display:grid;grid-template-columns:300px minmax(0,1fr) 260px;gap:28px;min-height:100vh;padding:28px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.notes,.tweaks{order:2}}
.notes,.tweaks{font-size:13px;line-height:1.6}
.panel{background:rgba(255,255,255,.72);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.page-dark .panel{background:rgba(255,255,255,.05)}
.panel h2{font-size:12px;letter-spacing:.06em;margin:0 0 10px;color:#5D695F;font-weight:600}
.page-dark .panel h2{color:#9AA99B}
.panel h3{font-size:17px;margin:0 0 8px;line-height:1.35}
.panel ul{margin:0;padding-left:18px}.panel li{margin:4px 0}
.ctl{margin-bottom:12px}.ctl label{display:block;font-size:12px;color:#5D695F;margin-bottom:5px}
.page-dark .ctl label{color:#9AA99B}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:10px;padding:3px;gap:2px}
.page-dark .seg{background:rgba(255,255,255,.08)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font:inherit;font-size:12px;color:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:#476B53;color:#fff}
select{width:100%;padding:8px;border-radius:10px;border:1px solid rgba(0,0,0,.15);font:inherit;font-size:13px;background:transparent;color:inherit}
.page-dark select{border-color:rgba(255,255,255,.2)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.feature + .feature{margin-top:14px}.fname{font-size:15px;font-weight:600;margin-bottom:4px}.gname{font-size:12px;opacity:.65;margin:10px 0 6px}
.jump button{border:1px solid rgba(0,0,0,.14);background:transparent;color:inherit;border-radius:99px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.page-dark .jump button{border-color:rgba(255,255,255,.18)}
.jump button[aria-current=true]{background:#476B53;color:#fff;border-color:#476B53}
main.center{display:flex;align-items:flex-start;justify-content:center;min-width:0;position:sticky;top:28px;align-self:start}
.scaler{transform-origin:top center}

/* ---------- Device ---------- */
.device{position:relative;background:#111;padding:12px;border-radius:62px;box-shadow:0 30px 60px -20px rgba(20,30,22,.35),0 0 0 1px rgba(0,0,0,.4)}
.device.pad{border-radius:40px;padding:16px}
.screen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--background);color:var(--ink);font-family:var(--font)}
.pad .screen{width:1180px;height:820px;border-radius:26px}
.status{position:absolute;inset:0 0 auto 0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0;font-size:16px;font-weight:600;z-index:30;pointer-events:none}
.pad .status{height:30px;padding:0 24px;font-size:13px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:31}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:40}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.nav{height:52px;margin-top:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.pad .nav{margin-top:30px}
.navbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--border)}
.navbtn:active{background:var(--subtle)}
.body{flex:1;overflow:auto;padding:4px 20px 24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.footer{flex:none;padding:12px 20px 34px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,var(--background) 80%,transparent)}
.pad .footer{padding-bottom:24px}
h1.lt{font-size:30px;line-height:38px;font-weight:650;letter-spacing:-.01em;margin:4px 0 8px}
.lead{font-size:16px;line-height:24px;color:var(--muted);margin:0 0 24px}
.section-label{font-size:13px;line-height:18px;color:var(--muted);margin:24px 4px 8px;font-weight:500}
.fine{font-size:13px;line-height:19px;color:var(--muted);margin:8px 4px 0}

/* groups & rows */
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;position:relative}
div.row{cursor:default}
button.row:active{background:var(--subtle)}
.row + .row::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--border);transform:scaleY(.5)}
.row.noicon + .row.noicon::before{left:16px}
.tile{width:32px;height:32px;border-radius:9px;background:var(--subtle);display:grid;place-items:center;flex:none;color:var(--accent)}
.rmain{flex:1;min-width:0}
.rtitle{font-size:16px;line-height:22px}
.rsub{font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}
.rval{font-size:15px;color:var(--muted);white-space:nowrap}
.chev{color:var(--muted);opacity:.7;flex:none}
.row.danger .rtitle{color:var(--error)}
.row.center{justify-content:center}.row.center .rmain{flex:none;text-align:center}.row.center .rtitle{font-weight:500}
.row[disabled]{cursor:default}.row[disabled] .rtitle{color:var(--muted)}
.row[data-sel="1"]{background:var(--focus)}
.badge{font-size:12px;line-height:20px;padding:0 8px;border-radius:99px;background:var(--accent);color:var(--onAccent);font-weight:600;white-space:nowrap}
.pill{font-size:12px;line-height:20px;padding:0 8px;border-radius:99px;background:var(--subtle);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--focus);color:var(--onFocus)}

/* identity */
.idcard{background:var(--focus);color:var(--onFocus);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center;margin:4px 0 8px}
.avatar{width:60px;height:60px;border-radius:30px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;font-size:24px;font-weight:600;flex:none}
.idname{font-size:20px;line-height:26px;font-weight:600;word-break:break-all}
.idmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.idmeta .pill{background:rgba(255,255,255,.6);color:var(--onFocus)}
.t-dark .idmeta .pill{background:rgba(255,255,255,.08)}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--accent);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--muted)}

/* buttons */
.btn{min-height:52px;border-radius:16px;border:0;font:inherit;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;cursor:pointer;width:100%;transition:background .15s,transform .12s}
.btn:active:not([disabled]){transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--onAccent)}.btn.primary:active{background:var(--accentPressed)}
.btn.tonal{background:var(--subtle);color:var(--ink)}
.btn.apple{background:var(--apple);color:var(--onApple)}
.btn.dangerfill{background:var(--error);color:var(--surface)}
.btn.text{background:transparent;color:var(--accent);min-height:44px;font-weight:500;font-size:16px}
.btn[disabled]{background:var(--subtle);color:var(--muted);cursor:not-allowed}
.btn.text[disabled]{background:transparent}
.btn.sm{min-height:36px;width:auto;font-size:14px;border-radius:12px;padding:0 14px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:500;padding:10px 4px;margin:-10px -4px;cursor:pointer}
.inline-links{display:flex;justify-content:center;gap:4px;font-size:15px;color:var(--muted);align-items:center}

/* fields */
.field{margin-bottom:16px}
.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;line-height:20px;color:var(--muted);margin:0 4px 8px;font-weight:500}
.inputwrap{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;min-height:54px;transition:border-color .15s,box-shadow .15s}
.inputwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.inputwrap.invalid{border-color:var(--error)}
.inputwrap input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:14px 16px;outline:none}
.inputwrap input::placeholder{color:var(--muted);opacity:.7}
.inputwrap input[readonly]{color:var(--muted)}
.eye{width:48px;height:48px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.ferr{display:flex;gap:6px;align-items:flex-start;color:var(--error);font-size:14px;line-height:20px;margin:8px 4px 0}
.rules{list-style:none;margin:10px 4px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.rules .mark{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--controlBorder);display:grid;place-items:center;flex:none;transition:all .2s}
.rules li.ok{color:var(--ink)}.rules li.ok .mark{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.meter{height:4px;border-radius:2px;background:var(--subtle);margin:10px 4px 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s}

/* otp */
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp .box{height:60px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);display:grid;place-items:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.otp .box.cur{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;cursor:text;width:100%}
.resend{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0;font-size:14px;color:var(--muted)}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:14px;line-height:20px;margin-bottom:16px}
.banner.info{background:var(--focus);color:var(--onFocus)}
.banner.warn{background:var(--warnSurface);color:var(--ink)}.banner.warn svg{color:var(--warn)}
.banner.error{background:var(--errorSurface);color:var(--ink)}.banner.error svg{color:var(--error)}
.banner > svg{flex:none;margin-top:0}
.banner .bmain{flex:1}.banner b{font-weight:600;display:block;margin-bottom:2px}
.banner .btn.sm{margin-top:10px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:19px;color:var(--muted);margin:12px 4px}
.note svg{flex:none;margin-top:1px}

/* steps */
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--subtle)}
.steps i.on{background:var(--accent)}
.stepcap{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:500}

/* cards & choices */
.card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.card h4{margin:0;font-size:17px;line-height:24px;font-weight:600}
.card .csub{font-size:13px;color:var(--muted);margin-top:2px;line-height:18px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid var(--border);background:transparent;border-radius:16px;padding:12px 14px;margin-top:10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.choice .radio{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--controlBorder);flex:none;margin-top:1px;display:grid;place-items:center}
.choice[aria-checked=true]{border-color:var(--accent);background:var(--focus)}
.choice[aria-checked=true] .radio{border-color:var(--accent)}
.choice[aria-checked=true] .radio::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--accent)}
.choice .ct{font-size:16px;font-weight:500;line-height:22px}.choice .cd{font-size:13px;color:var(--muted);line-height:18px;margin-top:2px}
.sub-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px;border-radius:12px;background:var(--subtle);cursor:pointer;border:0;width:100%;color:var(--ink);font:inherit;font-size:15px;text-align:left}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;padding:12px 4px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;font-size:16px;line-height:22px}
.check .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--controlBorder);flex:none;display:grid;place-items:center;background:var(--surface);transition:all .15s}
.check[aria-checked=true] .box{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.stat{font-size:32px;font-weight:650;line-height:40px;font-variant-numeric:tabular-nums}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--border)}
.tl .tdot{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--subtle);color:var(--muted)}
.tl .done .tdot{background:var(--accent);color:var(--onAccent)}
.tl .wait .tdot{background:var(--warnSurface);color:var(--warn)}
.tl .tt{font-size:16px;font-weight:500;line-height:22px}.tl .td{font-size:13px;color:var(--muted);line-height:18px;margin-top:2px}

/* sheet & toast */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--background);border-radius:28px 28px 0 0;z-index:51;padding:10px 20px 34px;animation:up .32s cubic-bezier(.2,.9,.25,1)}
.pad .sheet{left:50%;right:auto;bottom:auto;top:50%;width:460px;transform:translate(-50%,-50%);border-radius:24px;padding:24px;animation:pop .25s cubic-bezier(.2,.9,.25,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 16px}
.pad .grab{display:none}
.sheet h2{font-size:22px;line-height:28px;margin:4px 0 6px;font-weight:650}
.sheet p{font-size:15px;line-height:22px;color:var(--muted);margin:0 0 18px}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--background);font-size:14px;font-weight:500;padding:10px 16px;border-radius:99px;display:flex;gap:8px;align-items:center;white-space:nowrap;animation:drop .3s cubic-bezier(.2,.9,.25,1)}
.pad .toast{top:40px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-12px)}}
.enter{animation:push .34s cubic-bezier(.2,.85,.25,1)}
.enter-back{animation:pushb .3s cubic-bezier(.2,.85,.25,1)}
.enter-modal{animation:up .38s cubic-bezier(.2,.9,.25,1)}
@keyframes push{from{transform:translateX(28%);opacity:.4}}
@keyframes pushb{from{transform:translateX(-18%);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* result */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:80px}
.result .ring{width:84px;height:84px;border-radius:42px;background:var(--focus);color:var(--accent);display:grid;place-items:center;margin-bottom:22px}
.result h1{font-size:26px;margin:0 0 10px}
.result p{font-size:16px;line-height:24px;color:var(--muted);margin:0;max-width:300px}

/* iPad split */
.split{position:absolute;inset:0;display:grid;grid-template-columns:380px 1fr}
.split .side{border-right:1px solid var(--border);position:relative;background:var(--background)}
.split .detail{position:relative;background:var(--background)}
.split .detail .body,.split .detail .footer{padding-left:max(32px,calc((100% - 560px)/2));padding-right:max(32px,calc((100% - 560px)/2))}
.split .side .body{padding:4px 16px 24px}
.solo .body,.solo .footer{padding-left:calc((100% - 440px)/2);padding-right:calc((100% - 440px)/2)}
.empty-detail{display:grid;place-items:center;height:100%;color:var(--muted);font-size:15px}
.modalwrap{position:absolute;inset:0;z-index:45;background:var(--scrim);display:grid;place-items:center;animation:fade .2s}
.modalwrap .formsheet{position:relative;width:560px;height:740px;border-radius:24px;overflow:hidden;background:var(--background);animation:pop2 .3s cubic-bezier(.2,.9,.25,1)}
.formsheet .nav{margin-top:10px}
@keyframes pop2{from{opacity:0;transform:translateY(24px)}}
.anno{outline:2px dashed #C9812B;outline-offset:3px;position:relative;border-radius:24px}
.anno-tag{position:absolute;right:-6px;top:-12px;background:#C9812B;color:#fff;font-size:10px;line-height:16px;padding:0 6px;border-radius:6px;white-space:nowrap;z-index:5;font-weight:600}
/* ---------- app shell, chat, space, plan, whiteboard ---------- */
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:var(--subtle)}
.navright{display:flex;gap:8px;align-items:center;min-width:44px;justify-content:flex-end}
.sb{display:flex;flex-direction:column;min-height:100%;gap:4px}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px 6px}
.sb-brand{font-size:24px;font-weight:650;letter-spacing:-.01em}
.sb-space{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px;font:inherit;text-align:left;cursor:pointer;margin-bottom:10px}
.spbadge{width:40px;height:40px;border-radius:12px;background:var(--focus);color:var(--onFocus);display:grid;place-items:center;font-weight:650;font-size:17px;flex:none}
.sb-nav{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:transparent;color:var(--ink);border-radius:14px;padding:0 12px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
.sb-nav svg{color:var(--muted)}
.sb-nav.on{background:var(--focus);color:var(--onFocus);font-weight:600}.sb-nav.on svg{color:var(--accent)}
.sb-label{font-size:13px;color:var(--muted);margin:18px 12px 6px;font-weight:500}
.sb-conv{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;min-height:44px;border:0;background:transparent;color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;cursor:pointer;text-align:left}
.sb-conv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb-conv em{font-style:normal;font-size:12px;color:var(--muted);flex:none}
.sb-conv.on{background:var(--subtle)}
.sb-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.sb-me{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;padding:6px;border-radius:12px}
.avatar.sm{width:32px;height:32px;border-radius:16px;font-size:14px}

/* ---------- builders ---------- */
function anno(label,inner){return S.anno?'<div class="anno"><span class="anno-tag">'+esc(label)+'</span>'+inner+'</div>':inner;}
function row(o){
  const tag=o.act?'button':'div';
  return '<'+tag+' class="row'+(o.icon?'':' noicon')+(o.cls?' '+o.cls:'')+'" '+(o.act?'data-act="'+o.act+'"':'')+(o.disabled?' disabled':'')+'>'+
   (o.icon?'<span class="tile">'+I(o.icon,18)+'</span>':'')+
   '<span class="rmain"><div class="rtitle">'+o.title+'</div>'+(o.sub?'<div class="rsub">'+o.sub+'</div>':'')+'</span>'+
   (o.value?'<span class="rval">'+o.value+'</span>':'')+(o.badge?'<span class="badge">'+o.badge+'</span>':'')+(o.trail||'')+
   (o.act&&!o.nochev?'<span class="chev">'+I('chevR',16,2)+'</span>':'')+'</'+tag+'>';
}
function btn(label,act,kind='primary',o={}){
  const busy=S.busy===act;
  return '<button class="btn '+kind+'" data-act="'+act+'"'+(o.disabled||busy?' disabled':'')+'>'+(busy?'<span class="spin"></span>'+L('处理中','Working'):(o.icon||'')+label)+'</button>';
}
function field(name,label,o={}){
  const pw=o.type==='password',shown=S.show[name],v=S.f[name]??'',err=S.err[name];
  return '<div class="field"><div class="flabel"><label for="in-'+name+'">'+label+'</label>'+(o.link||'')+'</div>'+
   '<div class="inputwrap'+(err?' invalid':'')+'"><input id="in-'+name+'" data-name="'+name+'" '+(pw&&!shown?'type="password"':o.type==='email'?'type="email" inputmode="email"':'type="text"')+
   ' value="'+esc(v)+'" placeholder="'+(o.ph||'')+'" autocomplete="'+(o.ac||'off')+'" '+(o.readonly?'readonly':'')+' spellcheck="false">'+
   (pw?'<button class="eye" data-act="eye:'+name+'" aria-label="'+(shown?L('隐藏密码','Hide password'):L('显示密码','Show password'))+'">'+I(shown?'eyeOff':'eye',20)+'</button>':'')+
   '</div>'+(err?'<div class="ferr" role="alert">'+I('info',16)+'<span>'+err+'</span></div>':'')+(o.after||'')+'</div>';
}
function rules(name,confirm){
  const v=S.f[name]||'',c=S.f[confirm]||'',n=[...v].length,ok1=n>=6&&n<=20,ok2=c.length>0&&c===v;
  return '<div class="meter" aria-hidden="true"><i style="width:'+Math.min(100,n/6*100)+'%"></i></div><ul class="rules">'+
   '<li class="'+(ok1?'ok':'')+'"><span class="mark">'+(ok1?I('check',12,3):'')+'</span>'+L('6–20 个字符，不限字母、数字或符号','6–20 characters of any kind')+(n&&!ok1?'<span style="margin-left:auto;font-variant-numeric:tabular-nums">'+(n<6?n+'/6':L('超出 '+(n-20)+' 个','Over by '+(n-20)))+'</span>':'')+'</li>'+
   (confirm?'<li class="'+(ok2?'ok':'')+'"><span class="mark">'+(ok2?I('check',12,3):'')+'</span>'+L('两次输入一致','Both entries match')+'</li>':'')+'</ul>';
}
const pwValid=(a,b)=>{const n=[...(S.f[a]||'')].length;return n>=6&&n<=20&&(!b||S.f[a]===S.f[b]);};
function otp(name){
  const v=(S.f[name]||'').slice(0,6);let boxes='';
  for(let i=0;i<6;i++)boxes+='<div class="box'+(i===v.length?' cur':'')+'">'+(v[i]||'')+'</div>';
  return '<div class="otp">'+boxes+'<input data-name="'+name+'" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="'+L('六位验证码','Six-digit code')+'" value="'+esc(v)+'"></div>';
}
function banner(kind,title,body,action){return '<div class="banner '+kind+'" role="'+(kind==='error'?'alert':'status')+'">'+I(kind==='info'?'info':'warn',20)+'<div class="bmain">'+(title?'<b>'+title+'</b>':'')+(body||'')+(action||'')+'</div></div>';}
function steps(n,of,cap){let s='';for(let i=1;i<=of;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return '<div class="stepcap">'+cap+' · '+n+'/'+of+'</div><div class="steps">'+s+'</div>';}
function resend(){
  const left=Math.max(0,Math.ceil((S.resendAt-Date.now())/1000));
  return '<div class="resend"><span>'+L('没收到？看看垃圾邮件','Nothing? Check spam')+'</span>'+(left>0?'<span style="font-variant-numeric:tabular-nums">'+L(left+' 秒后可重发','Resend in '+left+'s')+'</span>':'<button class="linkbtn" data-act="resend">'+L('重新发送','Resend code')+'</button>')+'</div>';
}

function presetPlan(step){
 clearInterval(S._st);S.drawer=false;S.sheet=null;S.stack=[];S.conv='cPlan';S.dtIds=[];S.f.compose='';S._toBottom=true;
 S.pl={ver:0,state:'pending',edit:false,goal:''};const ms=[{role:'ai',reply:'planAsk',shown:99,done:true}];
 if(step!=='start'){S.pl.goal=EXAMPLES()[0];ms.push({role:'user',text:S.pl.goal},{role:'ai',reply:'planClarify',shown:99,done:true});}
 if(['draft','edit','done'].includes(step)){initDraft('ai');S.pl.ver=1;ms.push({role:'user',text:PLAN_ANSWERS()[0]},{role:'ai',reply:'planDraft',ver:1,shown:99,done:true});}
 if(step==='edit')S.pl.edit=true;
 if(step==='done'){S.pl.state='added';S.created=true;S.createdIn=S.space;ms.push({role:'ai',reply:'planDone',shown:99,done:true});}
 S.chat={msgs:ms,streaming:false};S.pl.msgs=ms;
}
function pushAI(m,user){Object.assign(m,{role:'ai',shown:0,done:false});S.chat.msgs=[...S.chat.msgs,...(user?[{role:'user',text:user}]:[]),m];if(S.conv==='cPlan')S.pl.msgs=S.chat.msgs;S._toBottom=true;startStream(m);}
function planSend(v){
 const P=S.pl;
 if(!P.ver&&!P.goal){P.goal=v;pushAI({reply:'planClarify'},v);}
 else if(!P.ver){initDraft('ai');P.ver=1;pushAI({reply:'planDraft',ver:1},v);}
 else if(P.state==='pending'){P.ver++;P.edit=false;S.dtIds.forEach(i=>{S.f['dt_'+i]=(S.f['dt_'+i]||'').replace('周三','周四').replace('Wed:','Thu:');});pushAI({reply:'planRevise',ver:P.ver},v);}
 else pushAI({reply:'planFollow'},v);
 S.f.compose='';S.screen=planScr();render('compose');
}

 const blocks=REPLIES[m.reply](m,last);const vis=blocks.slice(0,m.shown).join('');
 return '<div class="msg-ai">'+vis+(!m.done?'<span class="cursor"></span>':'')+(m.stopped?'<div class="msg-note">'+L('已停止生成','Stopped')+'</div>':'')+'</div>'+

}

/* ---------- actions ---------- */
function navTo(id,stack){S.drawer=false;S.sheet=null;S.stack=stack||[];S.screen=id;S.dir='push';S.animate=true;render();}
function extAct(k,p1,p2,a){
 switch(k){
 case 'drawer':S.drawer=!S.drawer;render();return true;
 case 'nav':if(p1==='chat.home'&&S.chat.msgs.length)return navTo(planScr()),true;navTo(p1);return true;
 case 'acct':navTo('account.home',[['chat.home']]);return true;
 case 'newchat':clearInterval(S._st);S.chat={msgs:[],streaming:false};S.conv=null;S.f.compose='';navTo('chat.home');return true;
 case 'conv':clearInterval(S._st);S.conv=p1;S._toBottom=true;if(p1==='cPlan'){S.chat={msgs:S.pl.msgs,streaming:false};navTo(planScr());return true;}S.chat={msgs:sampleThread(),streaming:false};navTo('chat.thread');return true;
 case 'suggest':S.f.compose=suggestions()[+p1];render('compose');return true;
 case 'send':{const v=(S.f.compose||'').trim();if(!v||S.chat.streaming)return true;
  if(S.conv==='cPlan'&&S.pl){planSend(v);return true;}
  const isPlan=/计划|排|拆|plan|train|schedule/i.test(v);if(isPlan){initDraft('ai');S.pl={ver:1,state:'pending',edit:false};}
  if(S.screen!=='chat.thread'){S.screen='chat.thread';S.dir='push';S.animate=true;}
  S.conv=S.conv&&S.conv!=='cPlan'?S.conv:'c1';S.f.compose='';pushAI({reply:isPlan?'plan':'generic',ver:isPlan?1:undefined},v);render('compose');return true;}
 case 'reply':if(S.chat.streaming||!S.pl||!S.pl.quick)return true;planSend(S.pl.quick[+p1]);return true;
 case 'stopgen':{clearInterval(S._st);const m=S.chat.msgs[S.chat.msgs.length-1];m.done=true;m.stopped=true;S.chat.streaming=false;
  if(m.reply==='planDraft'&&m.shown<2&&S.pl){S.pl.ver=0;m.ver=0;S.screen=planScr();}render();return true;}
 case 'regen':{const m=S.chat.msgs[S.chat.msgs.length-1];m.shown=0;m.done=false;m.stopped=false;startStream(m);render();return true;}
 case 'openDraft':presetPlan('draft');navTo('plan.draft');return true;
 case 'newplan':presetPlan('start');navTo('plan.start');return true;
 case 'toManual':initDraft('manual');S.modalBase=S.screen;go('plan.manual');return true;
 case 'planEdit':S.pl.edit=true;S.screen=planScr();render();return true;
 case 'planEditDone':S.pl.edit=false;S.screen=planScr();toast(L('草稿已保存','Draft saved'));return true;
 case 'dtAdd':{const id=Math.max(-1,...S.dtIds)+1;S.dtIds.push(id);S.f['dt_'+id]='';render('dt_'+id);return true;}
 case 'dtDel':S.dtIds=S.dtIds.filter(i=>i!==+p1);render();return true;
 case 'planConfirm':work('planConfirm',()=>{S.pl.state='added';S.pl.edit=false;S.created=true;S.createdIn=S.space;pushAI({reply:'planDone'});S.screen=planScr();render();},900);return true;

function go(id,param){if(id===S.screen&&param===S.param)return;const from=S.screen;S.stack.push([S.screen,S.param]);S.screen=id;S.param=param;S.err={};S.dir=['del','modal'].includes(SCREENS[id].flow)&&SCREENS[from].flow!==SCREENS[id].flow?'modal':'push';S.animate=true;render();}

function work(act,fn,ms=700){S.busy=act;render();setTimeout(()=>{S.busy=null;fn();},ms);}
function act(a){
  const [k,p1,p2]=a.split(':');
  if(extAct(k,p1,p2,a))return;
  if(k==='go')return go(p1,p2);
  if(k==='back')return back();
  if(k==='eye'){S.show[p1]=!S.show[p1];return render('');}
  if(k==='toast')return toast(a.slice(6));
  if(k==='sheet'){S.f.spw='';S.sheet={kind:p1,id:p2};return render();}
  if(k==='closeSheet'){S.sheet=null;return render();}
  if(k==='apple')return work('apple',()=>{reset('account.home');toast(L('已通过 Apple 登录','Signed in with Apple'));},900);
  if(k==='login'){if(S.f.pw==='wrong'){S.err.pw=L('邮箱或密码不正确。','Email or password is incorrect.');return render();}return work('login',()=>{reset('account.home');toast(L('已登录','Signed in'));});}
  if(k==='forgotSend')return work(k,()=>{S.resendAt=Date.now()+45e3;go('account.forgot2');});
  if(k==='forgotDone')return work(k,()=>reset('account.forgotDone'));
  if(k==='toLogin'){['pw','cur','npw','npw2','fpw','fpw2','fcode'].forEach(x=>S.f[x]='');S.f.email=S.f.email||'zhang.qiu@icloud.com';S.stack=[['account.entry']];S.screen='account.login';S.dir='push';S.animate=true;return render();}
  if(k==='consent'){S.f.consent=!S.f.consent;return render();}
  if(k==='regSend')return work(k,()=>{S.resendAt=Date.now()+45e3;go('account.reg2');});
  if(k==='resend'){S.resendAt=Date.now()+45e3;return toast(L('验证码已重新发送','Code resent'));}
  if(k==='regDone')return work(k,()=>{reset('account.home');toast(L('账号已创建','Account created'));},900);
  if(k==='pwDone')return work(k,()=>reset('account.pwDone'),900);
  if(k==='revoke')return work(a,()=>{S.sheet=null;S.revoked.push(p1);const d=baseDevices().find(x=>x.id===p1);toast(L('已退出「'+(d.label||'未命名设备')+'」','Signed out “'+(d.label||'Unnamed device')+'”'));});
  if(k==='revokeAll')return work(k,()=>{S.sheet=null;reset('account.entry');toast(L('已退出所有设备','Signed out everywhere'));});
  if(k==='signout')return work(k,()=>{S.sheet=null;reset('account.entry');toast(L('已退出登录','Signed out'));});
  if(k==='unlink')return work(k,()=>{S.sheet=null;toast(L('已移除邮箱登录','Email sign-in removed'));});
  if(k==='fc'){S.famChecks[p1]=!S.famChecks[p1];return render();}
  if(k==='famAccept')return work(k,()=>{S.famAccepted=true;back();toast(L('已记录你的确认','Your acceptance was recorded'));});
  if(k==='space')return work(k,()=>{S.spaceCreated=true;toast(L('账号空间已创建','Account space created'));});
  if(k==='del')return go('account.del1');
  if(k==='closeDel'){while(S.stack.length&&SCREENS[S.screen].flow==='del'){const p=S.stack.pop();S.screen=p[0];S.param=p[1];}S.dir='back';S.animate=true;return render();}
  if(k==='dc'){S.del.choices[p1]=p2;if(p2!=='transfer')delete S.del.recipient[p1];return render();}
  if(k==='rc'){S.del.recipient[p1]=p2;return render();}
  if(k==='delSubmit')return work(k,()=>{S.stack=[['account.entry']];S.screen='account.delProgress';S.dir='push';S.animate=true;render();toast(L('注销请求已受理','Deletion request accepted'));},1100);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tw],[data-jump]');if(!t||t.disabled)return;
  e.preventDefault();
  if(t.dataset.tw){let [k,v]=t.dataset.tw.split(':');if(k==='anno')v=v==='true';S[k]=v;persist();return render();}
  if(t.dataset.jump){const id=t.dataset.jump,fl=SCREENS[id].flow;S.sheet=null;
    if(SCREENS[id].jump){S.drawer=false;SCREENS[id].jump();S.screen=id;S.dir='push';S.animate=true;return render();}
    S.stack=id==='account.entry'?[]:id==='account.home'?[['account.entry']]:fl==='in'?[['account.entry'],['account.home']]:fl==='del'?[['account.entry'],['account.home']]:[['account.entry']];
    S.param=id==='account.del2r'?'f1':undefined;
    if(fl==='del'&&id!=='account.del1'){S.del.choices.f1=S.del.choices.f1||'transfer';S.del.choices.f2='end';if(id==='account.del3')S.del.recipient.f1='r1';}
    if(fl==='in'&&S.padDetail&&id==='account.home')S.padDetail=null;
    S.screen=id;S.dir='push';S.animate=true;return render();}
  act(t.dataset.act);
});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.name;if(!n)return;
  S.f[n]=n.endsWith('code')?e.target.value.replace(/\D/g,'').slice(0,6):e.target.value;delete S.err[n];
  render(n);if(n==='rcode'&&S.f[n].length===6)setTimeout(()=>go('account.reg3'),250);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.twSel){S[t.dataset.twSel]=t.value;persist();render();}});
window.addEventListener('resize',fit);
setInterval(()=>{if(['account.reg2','account.forgot2'].includes(S.screen)){const el=document.querySelector('.resend');if(el){const tmp=document.createElement('div');tmp.innerHTML=resend();el.replaceWith(tmp.firstChild);}}},1000);
render();
window.__proto={S,go,act,render};
})();
</script>
</body>
</html>
