# Siyue routing for api.qiugeapp.com -- INSERT INTO THE EXISTING SERVER BLOCK in
# /etc/nginx/sites-enabled/api.qiugeapp.com (host nginx at /usr/sbin/nginx, not a container).
#
# Rules this snippet follows:
#   * it adds only /api/siyue paths; every qiuge location (/api/cloud/*, the exact WeChat callback,
#     location /) keeps whatever it does today
#   * it never replaces the server block, the TLS settings or the certificate configuration
#   * "location = /api/siyue" returns 404 so a bare prefix never reaches Fastify, and unknown Siyue
#     paths must not fall back to the qiuge service
#   * proxy_pass ends in "/", which strips /api/siyue/ before Fastify sees the path
#   * X-Forwarded-For is overwritten with the real client address; Fastify only trusts
#     SIYUE_TRUSTED_PROXY_CIDRS, which must match the docker bridge subnet the port arrives from
#   * legal documents are served from the release directory as read-only static files, so nginx
#     needs o+rx on /opt/siyue and /opt/siyue/current (the release symlink)
#
# Apply: edit the existing server block, then
#   sudo -n /usr/sbin/nginx -t && sudo -n systemctl reload nginx
# Reload only after nginx -t passes, and never copy this file over the existing site file.

location = /api/siyue {
    return 404;
}

# Longer prefix than the API location below, so these two documents never reach Fastify.
# Bilingual terms are in legal/terms.html, the privacy policy in legal/privacy.html.
location ^~ /api/siyue/legal/ {
    alias /opt/siyue/current/legal/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=600" always;
    access_log off;
}

location ^~ /api/siyue/ {
    # Trailing slash strips /api/siyue/ before forwarding the rest of the path to Fastify.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    # Account requests must not land in the shared access log with their query strings.
    access_log off;
}
